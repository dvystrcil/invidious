# Harbor pull credentials for the CNPG Cluster's image
# (harbor.sirddail.net/cnpg/*, argocd-projects#55 AC6). It was first made for
# the PGO PostgresCluster's Crunchy images, removed in argocd-projects#310 PR C.
#
# Same pattern as wallos-harbor-pull: one InfisicalSecret per namespace,
# rendered from the shared HB_* keys in homelab-bz-gt/prod (robot$k8s, which
# has pull rights on every Harbor project). Sync-wave -2 so the Secret exists
# before the Cluster (wave -1) pulls its image.
#
# creationPolicy Orphan: deleting or renaming this CR must NOT take the Secret
# with it, or the next Postgres pod restart has no way to pull its image.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: invidious-postgres-harbor-pull
  namespace: invidious
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-bz-gt
        envSlug: prod
        secretsPath: "/"
        recursive: false
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
  managedKubeSecretReferences:
  - secretName: invidious-postgres-harbor-pull
    secretNamespace: invidious
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: "Orphan"
    template:
      includeAllSecrets: false
      data:
        ".dockerconfigjson": '{"auths":{"{{ .HB_REGISTRY.Value }}":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"}}}'
