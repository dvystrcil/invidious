# Real facts verified directly from upstream source before writing this
# (adopt-third-party-container checklist, homelab#848):
# - invidious Dockerfile: non-root uid 1000 (`adduser -u 1000 -S invidious`),
#   tini entrypoint, port 3000, healthcheck via GET /api/v1/stats.
# - invidious-companion Dockerfile: non-root uid 10001 (`adduser -u 10001
#   -S appuser`), tini entrypoint, healthcheck via GET /healthz,
#   SERVER_BASE_PATH=/companion baked in, needs a writable cache dir at
#   /var/tmp/youtubei.js despite an otherwise read-only root filesystem.
# - Config mechanism verified directly from src/invidious/config.cr:
#   every top-level Config field is independently overridable via
#   INVIDIOUS_<FIELD_UPCASED> env vars (Config.load merges these over the
#   YAML base) -- no INVIDIOUS_CONFIG blob or init-container templating
#   needed. related_videos/popular_enabled/feed_menu/default_home here are
#   set to disable YouTube's algorithmic recommendation surfaces while
#   leaving search intact (the actual goal, homelab#848).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious
  namespace: invidious
  labels:
    app.kubernetes.io/name: invidious
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious
  template:
    metadata:
      labels:
        app: invidious
    spec:
      # K8s auto-injects <SERVICE_NAME>_PORT (legacy Docker-links-style
      # env vars) for every Service in-namespace -- since our Service is
      # named "invidious", that's INVIDIOUS_PORT=tcp://<clusterIP>:3000,
      # which collides with Invidious's OWN INVIDIOUS_<FIELD> config-
      # override convention (config.cr treats any INVIDIOUS_* env var as
      # a Config field override) and crashes the app trying to parse a
      # URL as its `port` Int32 field. Confirmed live 2026-08-06.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: invidious
          image: quay.io/invidious/invidious:2.20260804.1
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: invidious-configmap
          env:
            - name: INVIDIOUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: invidious-postgres-pguser-invidious
                  key: pgbouncer-uri
            - name: INVIDIOUS_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: INVIDIOUS_HMAC_KEY
            - name: INVIDIOUS_INVIDIOUS_COMPANION_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: INVIDIOUS_COMPANION_KEY
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/stats
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # D-012 (VPA epic homelab#455): requests right-sized from the
          # Off-mode VPA's measured target.
          resources:
            # D-012: right-sized from the Off-mode VPA's measured target
            # (invidious), confirmed live 2026-08-06.
            requests:
              cpu: 25m
              memory: 250Mi
            limits:
              memory: 384Mi
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious-companion
  namespace: invidious
  labels:
    app.kubernetes.io/name: invidious
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious-companion
  template:
    metadata:
      labels:
        app: invidious-companion
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: invidious-companion
          image: quay.io/invidious/invidious-companion:latest
          ports:
            - name: http
              containerPort: 8282
          envFrom:
            - configMapRef:
                name: invidious-companion-configmap
          env:
            - name: SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-secrets
                  key: INVIDIOUS_COMPANION_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: youtubei-cache
              mountPath: /var/tmp/youtubei.js
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # D-012 (VPA epic homelab#455): requests right-sized from the
          # Off-mode VPA's measured target.
          resources:
            # D-012: right-sized from the Off-mode VPA's measured target
            # (invidious-companion), confirmed live 2026-08-06. Real CPU
            # need was ~10x the initial 25m guess.
            requests:
              cpu: 247m
              memory: 561Mi
            limits:
              memory: 640Mi
      volumes:
        - name: youtubei-cache
          emptyDir: {}
      restartPolicy: Always
